# AndroidX: required when using AndroidX dependencies
android.useAndroidX=true

# Suppress warning: AGP 8.2.2 tested up to compileSdk 34, project uses 36
android.suppressUnsupportedCompileSdk=36

# Use less memory for builds when system RAM is limited (debug APK)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
kotlin.compiler.execution.strategy=in-process
